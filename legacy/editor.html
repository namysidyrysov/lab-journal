<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор лабораторного журнала</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>

<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>Журнал</h1>
    <button id="btn-close-sidebar" title="Закрыть">×</button>
  </div>

  <div class="sidebar-actions">
    <button id="btn-new" class="primary">+ Новый эксперимент</button>
  </div>

  <ul id="exp-list" class="exp-list"></ul>

  <div class="sidebar-footer">
    <div class="save-status" id="save-status">—</div>
    <button id="btn-export" class="primary">💾 Скачать готовый HTML</button>
  </div>
</aside>

<div class="app" id="app">
  <header class="topbar">
    <button id="btn-open-sidebar" class="hamburger" title="Список экспериментов">☰</button>
    <span class="topbar-title">Редактор журнала</span>
  </header>

  <main class="editor" id="editor">
    <div class="empty-state" id="empty-state">
      <p>Нажмите ☰ слева вверху, чтобы выбрать эксперимент, или создайте новый.</p>
    </div>

    <div class="editor-body" id="editor-body" hidden>
      <div class="exp-header">
        <div class="exp-num">
          <span class="exp-label">Эксперимент №</span>
          <input type="text" id="f-num" placeholder="—" autocomplete="off">
        </div>
        <div class="exp-date">
          <span class="exp-label">Дата:</span>
          <input type="text" id="f-day" class="date-part day" placeholder="дд" maxlength="2" autocomplete="off">
          <select id="f-month" class="date-part month"></select>
          <input type="text" id="f-year" class="date-part year" placeholder="гггг" maxlength="4" autocomplete="off">
        </div>
      </div>

      <section class="field">
        <div class="field-header">
          <h2>Предпосылки</h2>
          <div class="toolbar">
            <button data-cmd="bold" title="Жирный"><b>B</b></button>
            <button data-cmd="italic" title="Курсив"><i>I</i></button>
            <button data-cmd="insertUnorderedList" title="Маркированный список">•</button>
            <button data-cmd="insertOrderedList" title="Нумерованный список">1.</button>
          </div>
        </div>
        <div class="richtext" id="f-goal" contenteditable="true"
             data-placeholder="Напишите здесь предпосылки эксперимента…"></div>
      </section>

      <section class="field">
        <div class="field-header">
          <h2>Изменения в схеме</h2>
          <div class="toolbar">
            <button data-cmd="bold"><b>B</b></button>
            <button data-cmd="italic"><i>I</i></button>
            <button data-cmd="insertUnorderedList">•</button>
            <button data-cmd="insertOrderedList">1.</button>
          </div>
        </div>
        <div class="richtext" id="f-scheme-text" contenteditable="true"
             data-placeholder="Текстовое описание схемы…"></div>

        <div class="gallery-wrap">
          <div class="gallery-toolbar">
            <button type="button" class="btn-insert-from-device" data-target="f-scheme">📁 Из устройства</button>
            <button type="button" class="btn-insert-from-buffer" data-target="f-scheme">📋 Из буфера</button>
          </div>
          <div class="gallery" id="f-scheme" data-kind="scheme" tabindex="0">
            <div class="gallery-dropzone">Область для картинок схемы</div>
          </div>
        </div>
      </section>

      <section class="field">
        <div class="field-header">
          <h2>Результаты</h2>
          <div class="toolbar">
            <button data-cmd="bold"><b>B</b></button>
            <button data-cmd="italic"><i>I</i></button>
            <button data-cmd="insertUnorderedList">•</button>
            <button data-cmd="insertOrderedList">1.</button>
          </div>
        </div>
        <div class="richtext" id="f-results-text" contenteditable="true"
             data-placeholder="Текстовое описание результатов…"></div>

        <div class="gallery-wrap">
          <div class="gallery-toolbar">
            <button type="button" class="btn-insert-from-device" data-target="f-results">📁 Из устройства</button>
            <button type="button" class="btn-insert-from-buffer" data-target="f-results">📋 Из буфера</button>
          </div>
          <div class="gallery" id="f-results" data-kind="results" tabindex="0">
            <div class="gallery-dropzone">Область для картинок результатов</div>
          </div>
        </div>
      </section>

      <section class="field">
        <div class="field-header">
          <h2>Наблюдения и выводы</h2>
          <div class="toolbar">
            <button data-cmd="bold"><b>B</b></button>
            <button data-cmd="italic"><i>I</i></button>
            <button data-cmd="insertUnorderedList">•</button>
            <button data-cmd="insertOrderedList">1.</button>
          </div>
        </div>
        <div class="richtext" id="f-conclusions" contenteditable="true"
             data-placeholder="Текстовое описание выводов…"></div>
      </section>
    </div>
  </main>
</div>

<script src="editor.js"></script>
</body>
</html>
